[package]
name = "staged-runner"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "Self-hosted GitHub Actions runners across hosts that spill over in a fixed order"
license = "MIT"
repository = "https://github.com/janit/staged-runner"

[dependencies]
clap = { version = "4.6.7", features = ["derive"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sysinfo = { version = "0.38.4", default-features = false, features = ["system"] }
tiny_http = "0.12.0"
toml = "1.1.8"
ureq = { version = "3.5.0", default-features = false }
